# Render Blueprint: one Docker web service (API + SPA) and a free Postgres database.
services:
  - type: web
    name: arms-hcm-lite
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: arms-hcm-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: TIME_ZONE
        value: Asia/Karachi
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_MODEL
        value: claude-opus-5-5
      - key: AI_API_KEY
        sync: false   # set in the Render dashboard; never commit it
databases:
  - name: arms-hcm-db
    plan: free
